[package]
name = "backup_parser"
version = "0.1.0"
edition = "2024"
description = "Typed JSONC path manifests for restic backups and restores"
license = "MIT"

[profile.release]
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
glob = "0.3.4"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
nix = { version = "0.31.3", features = ["user", "fs"] }
path-clean = "1.0.1"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
